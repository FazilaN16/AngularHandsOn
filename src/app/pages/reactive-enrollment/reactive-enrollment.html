<h2>Reactive Student Enrollment Form</h2>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

  <!-- Student Name -->
  <div>
    <label>Student Name:</label><br>

    <input
      type="text"
      formControlName="studentName">

    <div *ngIf="enrollForm.get('studentName')?.touched">

      <p *ngIf="enrollForm.get('studentName')?.errors?.['required']" style="color:red">
        Name is required
      </p>

      <p *ngIf="enrollForm.get('studentName')?.errors?.['minlength']" style="color:red">
        Name must be at least 3 characters
      </p>

    </div>
  </div>

  <br>

  <!-- Email -->
  <div>
    <label>Email:</label><br>

    <input
      type="email"
      formControlName="studentEmail">

    <div *ngIf="enrollForm.get('studentEmail')?.touched">

      <p *ngIf="enrollForm.get('studentEmail')?.errors?.['required']" style="color:red">
        Email is required
      </p>

      <p *ngIf="enrollForm.get('studentEmail')?.errors?.['email']" style="color:red">
        Enter a valid email
      </p>

      <p *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']" style="color:red">
        Email already taken
      </p>

    </div>
  </div>

  <br>

  <!-- Course ID -->
  <div>
    <label>Course ID:</label><br>

    <input
      type="text"
      formControlName="courseId">

    <div *ngIf="enrollForm.get('courseId')?.touched">

      <p *ngIf="enrollForm.get('courseId')?.errors?.['required']" style="color:red">
        Course ID is required
      </p>

      <p *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']" style="color:red">
        Course code starting with XX is not allowed.
      </p>

    </div>
  </div>

  <br>

  <!-- Preferred Semester -->
  <div>
    <label>Preferred Semester:</label><br>

    <select formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <br>

  <!-- Agree to Terms -->
  <div>

    <label>
      <input
        type="checkbox"
        formControlName="agreeToTerms">

      I agree to the terms and conditions
    </label>

    <div *ngIf="enrollForm.get('agreeToTerms')?.touched">

      <p *ngIf="enrollForm.get('agreeToTerms')?.errors?.['required']" style="color:red">
        You must accept the terms and conditions.
      </p>

    </div>

  </div>

  <br>

 <!-- Additional Courses -->
<h3>Additional Courses</h3>

<button
  type="button"
  (click)="addCourse()">
  Add Another Course
</button>

<br><br>

<div *ngFor="let ctrl of additionalCourses.controls; let i = index">

  <input
    [formControl]="$any(ctrl)" placeholder="Course Name">

  <button
    type="button"
    (click)="removeCourse(i)">
    Remove
  </button>

</div>

<br>

<!-- Submit -->
<button
  type="submit"
  [disabled]="enrollForm.invalid">
  Submit
</button>
