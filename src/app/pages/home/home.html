<h1>{{ portalName }}</h1>

<p>
  This portal helps students view available courses and manage their profile.
</p>

<hr>

<h3>Statistics</h3>

<p>Courses Available: 12</p>
<p>Enrolled: 3</p>
<p>GPA: 3.8</p>
<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>
<p>{{ message }}</p>

<hr>

<h3>Search Courses</h3>

<input [(ngModel)]="searchTerm" placeholder="Search for a course">

<p>Searching for: {{ searchTerm }}</p>
